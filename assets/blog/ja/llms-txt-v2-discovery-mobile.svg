  <title id="title">推測ではなく明示的に検出</title><desc id="description">llms.txt v2では、ページを説明する索引と、利用可能なMarkdown表現の両方をページから明示的に知らせることができます。</desc><text class="title" x="400" y="70" fill="#f6fbff" font-size="44">推測ではなく明示的に検出</text>
