    <rect x="95" y="665" width="610" height="100" rx="22" fill="#0c2949" stroke="#54e5e7" stroke-opacity=".7"/><text class="label" x="245" y="707" fill="#f6fbff" font-size="28">Sitio general</text><text class="code" x="540" y="707" fill="#bdfaff" font-size="24">/llms.txt</text><text class="detail" x="400" y="741" fill="#9fdce8" font-size="24">Describe el sitio general</text><rect x="95" y="790" width="610" height="100" rx="22" fill="#0e3658" stroke="#54e5e7" stroke-opacity=".7"/><text class="label" x="245" y="832" fill="#f6fbff" font-size="28">Área de Docs</text><text class="code" x="540" y="832" fill="#bdfaff" font-size="24">/docs/llms.txt</text><text class="detail" x="400" y="866" fill="#9fdce8" font-size="24">Índice aplicable más específico</text><rect x="95" y="915" width="610" height="100" rx="22" fill="#0e3658" stroke="#54e5e7" stroke-opacity=".7"/><text class="label" x="245" y="957" fill="#f6fbff" font-size="28">Área de API</text><text class="code" x="540" y="957" fill="#bdfaff" font-size="24">/api/llms.txt</text><text class="detail" x="400" y="991" fill="#9fdce8" font-size="24">Índice aplicable más específico</text></svg>
