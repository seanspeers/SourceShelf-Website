  <title id="title">Webナレッジから選択したAIコンテキストへ</title><desc id="description">Webサイトからllms.txtのMarkdownガイドを経てAIアシスタントへつながる図。「AIがWebサイトを理解するために」というメッセージを表示。</desc><text class="title" x="600" y="90" fill="#f6fbff" font-size="37">Webナレッジから選択したAIコンテキストへ</text><g fill="none" stroke="#7beff4" stroke-width="6" stroke-linecap="round"><path d="M230 325h35M465 325h35M700 325h35M935 325h35"/><path d="M248 312l17 13-17 13M483 312l17 13-17 13M718 312l17 13-17 13M953 312l17 13-17 13"/></g><g filter="url(#shadow)"><rect x="30" y="240" width="200" height="170" rx="28" fill="#0c2949" stroke="#63cddd" stroke-opacity=".65"/><text class="label" x="130" y="335" fill="#f6fbff" font-size="23">Webサイト</text></g><g filter="url(#shadow)"><rect x="265" y="240" width="200" height="170" rx="28" fill="#0c2949" stroke="#63cddd" stroke-opacity=".65"/><text class="label" x="365" y="335" fill="#f6fbff" font-size="23">llms.txt</text></g><g filter="url(#shadow)"><rect x="500" y="240" width="200" height="170" rx="28" fill="url(#accent)" stroke="#63cddd" stroke-opacity=".65"/><text class="label" x="600" y="335" fill="#041121" font-size="23">SourceShelf</text></g><g filter="url(#shadow)"><rect x="735" y="240" width="200" height="170" rx="28" fill="#0c2949" stroke="#63cddd" stroke-opacity=".65"/><text class="label" x="835" y="335" fill="#f6fbff" font-size="23">ナレッジパック</text></g><g filter="url(#shadow)"><rect x="970" y="240" width="200" height="170" rx="28" fill="#0c2949" stroke="#63cddd" stroke-opacity=".65"/><text class="label" x="1070" y="335" fill="#f6fbff" font-size="23">AIツール</text></g></svg>
