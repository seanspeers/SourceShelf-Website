<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1360" viewBox="0 0 720 1360" role="img" aria-labelledby="title description">
  <title id="title">1つのパック、3つの活用方法</title><desc id="description">PDF・Webページ・メモ・Officeファイル. SourceShelfパック. Ask This Pack: 選択した根拠: オンデバイスモデル: 引用付きの回答. OKFバンドル: Markdownとメタデータ: 持ち運べるエクスポート: 対応ツールで活用. Siri AI: App Entities → Spotlight: システム全体から発見: アプリ側の連携が必要. Siri連携の概念図。OKFの書き出しだけではSiriの索引に登録されません。</desc>
