  <title id="title">3つのファイル、3つの役割</title><desc id="description">Webサイトからllms.txtのMarkdownガイドを経てAIアシスタントへつながる図。「AIがWebサイトを理解するために」というメッセージを表示。</desc><text class="title" x="600" y="92" fill="#f6fbff" font-size="40">3つのファイル、3つの役割</text><g filter="url(#shadow)"><rect x="70" y="166" width="350" height="365" rx="32" fill="#0c2745" stroke="#6ca6cd" stroke-opacity=".7"/><rect x="165" y="218" width="160" height="124" rx="14" fill="#07182d"/><path d="M275 218v45h50" fill="none" stroke="#7beff4" stroke-width="5"/><path d="M192 294h105M192 317h74" stroke="#8bc8ea" stroke-width="7" stroke-linecap="round"/><text class="label" x="245" y="405" fill="#f6fbff" font-size="30">robots.txt</text><text class="detail" x="245" y="455" fill="#a8dcec" font-size="20">クローラー設定</text></g><g filter="url(#shadow)"><rect x="425" y="166" width="350" height="365" rx="32" fill="#0c2745" stroke="#6ca6cd" stroke-opacity=".7"/><rect x="520" y="218" width="160" height="124" rx="14" fill="#07182d"/><path d="M630 218v45h50" fill="none" stroke="#7beff4" stroke-width="5"/><path d="M547 294h105M547 317h74" stroke="#8bc8ea" stroke-width="7" stroke-linecap="round"/><text class="label" x="600" y="405" fill="#f6fbff" font-size="30">sitemap.xml</text><text class="detail" x="600" y="455" fill="#a8dcec" font-size="20">WebサイトのURL</text></g><g filter="url(#shadow)"><rect x="780" y="166" width="350" height="365" rx="32" fill="#0e3457" stroke="#54e5e7" stroke-opacity=".7"/><rect x="875" y="218" width="160" height="124" rx="14" fill="#07182d"/><path d="M985 218v45h50" fill="none" stroke="#7beff4" stroke-width="5"/><path d="M902 294h105M902 317h74" stroke="#8bc8ea" stroke-width="7" stroke-linecap="round"/><text class="label" x="955" y="405" fill="#f6fbff" font-size="30">llms.txt</text><text class="detail" x="955" y="455" fill="#a8dcec" font-size="20">AI向けコンテキスト</text></g></svg>
