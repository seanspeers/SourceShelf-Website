  <title id="title">O llms.txt mais próximo se aplica</title><desc id="description">Um arquivo llms.txt pode descrever uma parte específica de um site, permitindo que sites grandes ofereçam coleções de conhecimento mais focadas.</desc><text class="title" x="600" y="72" fill="#f6fbff" font-size="40">O llms.txt mais próximo se aplica</text>
    <g filter="url(#shadow)"><rect x="55" y="120" width="680" height="500" rx="32" fill="#0b2747" stroke="#6ca6cd" stroke-opacity=".62"/></g><text class="code" x="120" y="175" fill="#f6fbff" font-size="25" text-anchor="start">example.com</text>
    <g class="code" font-size="22" text-anchor="start"><path d="M117 192v328M117 215h43M117 270h43M117 325h43M117 520h43M190 338v132M190 370h43M190 420h43M190 470h43M190 535v65M190 560h43M190 600h43" fill="none" stroke="#6ca6cd" stroke-width="4" stroke-linecap="round"/><text x="174" y="223" fill="#54e5e7">llms.txt</text><text x="174" y="278" fill="#d7e7f1">about/</text><text x="174" y="333" fill="#f6fbff">docs/</text><text x="247" y="378" fill="#54e5e7">llms.txt</text><text x="247" y="428" fill="#d7e7f1">getting-started</text><text x="247" y="478" fill="#d7e7f1">reference</text><text x="174" y="528" fill="#f6fbff">api/</text><text x="247" y="568" fill="#54e5e7">llms.txt</text><text x="247" y="608" fill="#d7e7f1">endpoints</text></g>
    <g><rect x="785" y="145" width="350" height="122" rx="22" fill="#0c2949" stroke="#54e5e7" stroke-opacity=".7"/><text class="label" x="960" y="185" fill="#f6fbff" font-size="24">Site geral</text><text class="code" x="960" y="223" fill="#bdfaff" font-size="20">/llms.txt</text><text class="detail" x="960" y="250" fill="#9fdce8" font-size="15">Descreve o site geral</text><rect x="785" y="307" width="350" height="122" rx="22" fill="#0e3658" stroke="#54e5e7" stroke-opacity=".7"/><text class="label" x="960" y="347" fill="#f6fbff" font-size="24">Área de Docs</text><text class="code" x="960" y="385" fill="#bdfaff" font-size="20">/docs/llms.txt</text><text class="detail" x="960" y="412" fill="#9fdce8" font-size="15">Índice aplicável mais específico</text><rect x="785" y="469" width="350" height="122" rx="22" fill="#0e3658" stroke="#54e5e7" stroke-opacity=".7"/><text class="label" x="960" y="509" fill="#f6fbff" font-size="24">Área de API</text><text class="code" x="960" y="547" fill="#bdfaff" font-size="20">/api/llms.txt</text><text class="detail" x="960" y="574" fill="#9fdce8" font-size="15">Índice aplicável mais específico</text></g></svg>
