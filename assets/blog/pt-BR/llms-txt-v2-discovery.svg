  <title id="title">Descoberta explícita, sem adivinhação</title><desc id="description">O llms.txt v2 permite que uma página anuncie explicitamente o índice que a descreve e uma representação Markdown disponível.</desc><text class="title" x="600" y="72" fill="#f6fbff" font-size="40">Descoberta explícita, sem adivinhação</text>
