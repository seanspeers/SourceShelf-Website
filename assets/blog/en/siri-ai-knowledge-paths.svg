  <text x="600" y="115" text-anchor="middle" fill="#9dbad0" font-size="22" font-weight="400">The collection stays yours. Each path serves a different purpose.</text>
  <text x="600" y="156" text-anchor="middle" fill="#bfd6e5" font-size="22" font-weight="400">PDFs · webpages · notes · Office files</text>
