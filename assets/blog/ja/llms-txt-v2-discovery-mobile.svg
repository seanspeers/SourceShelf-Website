    <text class="label" x="400" y="160" fill="#d7e7f1" font-size="32">従来の検出</text><rect x="175" y="190" width="450" height="62" rx="15" fill="#07182d"/><text class="code" x="400" y="230" fill="#f6fbff" font-size="28">website.example</text><path d="M400 252v38" stroke="#8bb8d2" stroke-width="5" stroke-dasharray="8 9"/><circle cx="400" cy="322" r="27" fill="#102c49" stroke="#8bb8d2"/><text class="label" x="400" y="332" fill="#d7e7f1" font-size="30">?</text><path d="M400 349v32" stroke="#8bb8d2" stroke-width="5" stroke-dasharray="8 9"/><rect x="235" y="381" width="330" height="55" rx="14" fill="#07182d"/><text class="code" x="400" y="417" fill="#d7e7f1" font-size="26">/llms.txtを試す</text>
    <text class="label" x="400" y="567" fill="#bdfaff" font-size="32">明示的なv2検出</text><rect x="230" y="595" width="340" height="60" rx="15" fill="#07182d"/><text class="label" x="400" y="633" fill="#f6fbff" font-size="28">Webページ</text><path d="M400 655v38M400 693H235v30M400 693h165v30" fill="none" stroke="#7beff4" stroke-width="5"/>
    <rect x="90" y="723" width="290" height="70" rx="15" fill="#08213b" stroke="#54e5e7"/><text class="code" x="235" y="766" fill="#bdfaff" font-size="25">rel=&quot;describedby&quot;</text><rect x="420" y="723" width="290" height="70" rx="15" fill="#08213b" stroke="#54e5e7"/><text class="code" x="565" y="754" fill="#bdfaff" font-size="25">rel=&quot;alternate&quot;</text><text class="detail" x="565" y="780" fill="#9fdce8" font-size="21">text/markdown</text>
