<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1360" viewBox="0 0 720 1360" role="img" aria-labelledby="title description">
  <title id="title">One Pack. Three paths.</title><desc id="description">PDFs · webpages · notes · Office files. SourceShelf Pack. Ask This Pack: Selected evidence: On-device model: Answers with citations. OKF bundle: Markdown + metadata: Portable export: Use with compatible tools. Siri AI: App Entities → Spotlight: Systemwide discovery: Requires app integration. Conceptual Siri path. An OKF export does not automatically enter Siri’s index.</desc>
