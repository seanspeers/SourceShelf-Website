  <text x="360" y="119" text-anchor="middle" fill="#9dbad0" font-size="17.34265734265734" font-weight="400">The collection stays yours. Each path serves a different purpose.</text>
  <text x="360" y="180" text-anchor="middle" fill="#bfd6e5" font-size="22" font-weight="400">PDFs · webpages · notes · Office files</text>
