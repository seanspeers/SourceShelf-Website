  <title id="title">Se aplica el llms.txt más cercano</title><desc id="description">Un archivo llms.txt puede describir una parte específica de un sitio, lo que permite que sitios grandes expongan colecciones de conocimiento más enfocadas.</desc><text class="title" x="400" y="70" fill="#f6fbff" font-size="37">Se aplica el llms.txt más cercano</text><g filter="url(#shadow)"><rect x="55" y="110" width="690" height="510" rx="30" fill="#0b2747" stroke="#6ca6cd" stroke-opacity=".62"/></g><text class="code" x="105" y="164" fill="#f6fbff" font-size="29" text-anchor="start">example.com</text>
